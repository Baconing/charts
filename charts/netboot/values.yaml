    # -- Prefixes for the TFTP filenames of x86_64 EFI binaries.
    # Prevents clashing with other architectures.
    prefix: x86_64-efi-

    # -- x86_64 EFI iPXE binary (uses built-in iPXE NIC drivers).
    ipxe:
      enabled: true
      # -- The name of the binary served on the TFTP server.
      name: ipxe.efi
      # -- The URL to fetch the x86_64 EFI ipxe.efi binary from.
      url: http://boot.ipxe.org/x86_64-efi/ipxe.efi

    # -- Legacy x86_64 EFI iPXE binary (no USB NIC drivers).
    ipxe-legacy:
      enabled: true
      # -- The name of the binary served on the TFTP server.
      name: ipxe-legacy.efi
      # -- The URL to fetch the x86_64 EFI ipxe-legacy.efi binary from.
      url: http://boot.ipxe.org/x86_64-efi/ipxe-legacy.efi

    # -- x86_64 EFI iPXE binary with Simple Network Protocol.
    snponly:
      enabled: true
      # -- The name of the binary served on the TFTP server.
      name: snponly.efi
      # -- The URL to fetch the x86_64 EFI snponly.efi binary from.
      url: http://boot.ipxe.org/x86_64-efi/snponly.efi

