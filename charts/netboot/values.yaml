service:
  enabled: true
  type: ClusterIP
  ports:
    tftp:
      port: 69
      targetPort: 6969
    http:
      port: 80
      targetPort: 8080
  clusterIP:
  loadBalancerIP:
  nodePort:
  externalTrafficPolicy:
  externalIPs:
  ipFamilyPolicy:
  ipFamilies:
  loadBalancerSourceRanges: []
  annotations: {}
  labels: {}
  loadBalancerClass:

storage:
  dataVolume:
    # -- The type of storage to use for the TFTP and HTTP servers.
    # pvc is recommended to prevent redownloading files from the internet every time the pod is restarted.
    type: pvc
    enabled: false
    accessModes: 
      - ReadWriteMany
    size: 1Gi
    storageClass:
    labels: {}
    annotations: {}
  mounts:
    initContainers:
      initiPXE:
        dataVolume:
          enabled: true
          path: /data/ipxe
          subPath: /ipxe
          readOnly: false
      initExtraFiles:
        dataVolume:
          enabled: true
          path: /data/assets
          subPath: /assets
          readOnly: false
    containers:
      tftp:
        dataVolume:
          enabled: true
          path: /data/assets/tftp
          subPath: assets/tftp
          readOnly: true
        tftpScriptsConfig:
          enabled: true
          path: /scripts
          readOnly: true
      http:
        dataVolume:
          enabled: true
          path: /data/assets/http
          subPath: assets/http
          readOnly: true
        httpScriptsConfig:
          enabled: true
          path: /scripts
          readOnly: true
#     sidecar:
#       dataVolume:
#         enabled: true

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

extraContainers: []
extraInitContainers: []

extraVolumes: []
extraTFTPVolumeMounts: []
extraHTTPVolumeMounts: []
extraInitVolumeMounts: []