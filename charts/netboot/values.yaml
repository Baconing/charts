# -- The number of replicas to set for the deployment.
replicaCount: 1

# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- The scripts that will be exposed on the TFTP and HTTP servers.
# It's recommended to use extraFiles to add additional files to the TFTP server and only use this for iPXE scripts.
# Files here are not saved to persistent storage (if enabled) and by default are read-only mounted.
ipxeScripts:
  # -- Scripts/files here will be exposed on the TFTP server.
  tftp:
    # -- This deploys the ConfigMap that will be used for the TFTP server's iPXE scripts/files (unless existingConfigMap is set) and mounts it to the pod.
    enabled: true
    # -- Supply an existing ConfigMap to use for the TFTP server's iPXE scripts/files.
    # @default -- nil
    existingConfigMap:
    # -- This is the default iPXE script that will be served from the TFTP server.
    # It's recommended to keep this script as simple as possible (aka the default) and chainload another script from the HTTP server.
    autoexec.ipxe:
      #!ipxe
      echo Chainloading default iPXE script from HTTP server...
      dhcp
      set conn_type http
      chain --autofree http://${next-server}/scripts/default.ipxe || echo HTTP failed, localbooting...
#   additional.ipxe: |
#     #!ipxe
#     echo This is an additional iPXE script that is hosted on the TFTP server.
  # -- Scripts/files here will be exposed on the HTTP server.
  http:
    enabled: true
    # -- This deploys the ConfigMap that will be used for the HTTP server's files (unless existingConfigMap is set) and mounts it to the pod.
    # @default -- nil
    existingConfigMap:
    # -- This is the default iPXE script that will be chainloaded from autoexec.ipxe on the TFTP server.
    # @default -- nil
    default.ipxe:
#   additional.ipxe: |
#     #!ipxe
#     echo This is an additional iPXE script that is hosted on the HTTP server.

# -- The extra files that will be exposed on the TFTP and HTTP servers.
# This is useful for serving kernels, initramfs, and ISOs on your LAN instead of having to download them from the internet every time you want to netboot a machine.
# Files here are saved to persistent storage (if enabled), even if the content variable is set.
extraFiles:
  # -- Files here will be exposed on the TFTP server.
  tftp:
    - name:
      # -- (string) The content of the file. If this is set, url will be ignored.
      content:
      # -- (string) The URL to fetch the file from. If this is set, content will be ignored.
      url:
      # -- (string) The URL to the checksum file for the file. If this is set, the checksum will be verified before serving the file.
      # If the file doesn't match the checksum, it will be re-downloaded from the url. Otherwise, it will not be served.
      # If the file doesn't match the checksum right after a download, it will not be served or saved.
      checksumUrl:
  # -- Files here will be exposed on the HTTP server.
  http:
    - name:
      # -- (string) The content of the file. If this is set, url will be ignored.
      content:
      # -- (string) The URL to fetch the file from. If this is set, content will be ignored.
      url:
      # -- (string) The URL to the checksum file for the file. If this is set, the checksum will be verified before serving the file.
      # If the file doesn't match the checksum, it will be re-downloaded from the url. Otherwise, it will not be served.
      # If the file doesn't match the checksum right after a download, it will not be served or saved.
      checksumUrl:

# -- The URLs to fetch the iPXE binaries from.
# Use extraFiles.tftp to serve additional iPXE binaries not listed here.
# Files here are saved to persistent storage (if enabled).
ipxe:
  x86:
    # -- Download and serve x86 iPXE binaries.
    enabled: true

    # -- Prefixes for the TFTP filenames of x86 iPXE binaries.
    # Prevents clashing with other architectures.
    prefix: x86-

    # -- x86 iPXE binary (unloads UNDI drivers and relies on iPXE's built-in NIC drivers).
    ipxe:
      enabled: true
      # -- The name of the binary served on the TFTP server.
      name: ipxe.pxe
      # -- The URL to fetch the x86 ipxe.pxe binary from.
      url: http://boot.ipxe.org/ipxe.pxe

    # -- x86 iPXE binary (keeps the UNDI drivers loaded)
    undionly:
      enabled: true
      # -- The name of the binary served on the TFTP server.
      name: undionly.kpxe
      # -- The URL to fetch the x86 undionly.kpxe binary from.
      url: http://boot.ipxe.org/undionly.kpxe
  
  # -- x86_64 EFI iPXE binaries.
