apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netboot.fullname" . }}
  labels:
    {{- include "netboot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "netboot.name" . }}
      {{- include "netboot.selectorLabels" . | nindent 4 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "netboot.name" . }}
        {{- include "netboot.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-ipxe
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting iPXE binary sync..."
              mkdir -p /data/ipxe
              {{- range $arch, $archCfg := .Values.ipxe }}
              {{- if and (kindIs "map" $archCfg) $archCfg.enabled }}
              echo "Processing arch: {{ $arch }}..."
              {{- $prefix := default "" $archCfg.prefix }}
              {{- range $binKey, $binCfg := omit $archCfg "enabled" "prefix" }}
              {{- if and (kindIs "map" $binCfg) $binCfg.enabled }}
              echo "Downloading {{ $prefix }}{{ $binCfg.name }} from {{ $binCfg.url }}"
              curl -szL --retry 3 -o /data/ipxe/{{ $prefix }}{{ $binCfg.name }} {{ $binCfg.url }}
              {{- end }}
              {{- end }}
              {{- end }}
              {{- end }}
              echo "Done."
          volumeMounts:
            {{- range $key, $val := .Values.storage.mounts.initContainers.initiPXE }}
            {{- if $val.enabled }}
            - name: {{ $key }}
              mountPath: {{ $val.path }}
              {{- if $val.subPath }}
              subPath: {{ $val.subPath }}
              {{- end }}
              readOnly: {{ $val.readOnly }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraInitVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - name: init-extrafiles
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting extra files sync..."
              mkdir -p /data/assets/tftp /data/assets/http
              # Logic to loop over values.extraFiles goes here...
              echo "Done."
          volumeMounts:
            {{- range $key, $val := .Values.storage.mounts.initContainers.initExtraFiles }}
            {{- if $val.enabled }}
            - name: {{ $key }}
              mountPath: {{ $val.path }}
              {{- if $val.subPath }}
              subPath: {{ $val.subPath }}
              {{- end }}
              readOnly: {{ $val.readOnly }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraInitVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      containers:
        - name: tftp
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting TFTP server..."
              apk add --no-cache tftp-hpa

              mkdir -p /var/lib/tftpboot
              ln -s /data/assets/tftp/* /var/lib/tftpboot/
              ln -s /scripts/tftp/* /var/lib/tftpboot/

              in.tftpd --foreground --address 0.0.0.0:{{ .Values.service.ports.tftp.targetPort }} --secure /var/lib/tftpboot
          ports:
            - name: tftp
              containerPort: {{ .Values.service.ports.tftp.targetPort }}
              protocol: UDP
          volumeMounts:
            {{- range $key, $val := .Values.storage.mounts.containers.tftp }}
            {{- if $val.enabled }}
            - name: {{ $key }}
              mountPath: {{ $val.path }}
              {{- if $val.subPath }}
              subPath: {{ $val.subPath }}
              {{- end }}
              readOnly: {{ $val.readOnly }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraTFTPVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - name: http
          image: nginx:alpine
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.http.targetPort }}
              protocol: TCP
          volumeMounts:
            {{- range $key, $val := .Values.storage.mounts.containers.http }}
            {{- if $val.enabled }}
            - name: {{ $key }}
              mountPath: {{ $val.path }}
              {{- if $val.subPath }}
              subPath: {{ $val.subPath }}
              {{- end }}
              readOnly: {{ $val.readOnly }}
            {{- end }}
            {{- end }}
            - name: {{ include "netboot.fullname" . }}-nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- with .Values.extraHTTPVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      volumes:
        - name: dataVolume
          {{- if and .Values.storage.dataVolume.enabled (eq .Values.storage.dataVolume.type "pvc") }}
          persistentVolumeClaim:
            claimName: {{ include "netboot.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        
        - name: tftpScriptsConfig
          configMap:
            name: {{ default (printf "%s-tftp-scripts" (include "netboot.fullname" .)) .Values.ipxeScripts.tftp.existingConfigMap }}
            
        - name: httpScriptsConfig
          configMap:
            name: {{ default (printf "%s-http-scripts" (include "netboot.fullname" .)) .Values.ipxeScripts.http.existingConfigMap }}

        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}